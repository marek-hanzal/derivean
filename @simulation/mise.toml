[tools."github:xmake-io/xmake"]
version = "v3.1.2"
bin_path = "."

[tools."github:xmake-io/xmake".platforms.macos-arm64]
asset_pattern = "xmake-bundle-v3.1.2.macos.arm64"
rename_exe = "xmake"
checksum = "sha256:e719121c56cd34f5f0c0731954a154c1df1b0915f303e5c82dfb6c6cb9e3ef9e"

[tools."github:xmake-io/xmake".platforms.windows-x64]
asset_pattern = "xmake-bundle-v3.1.2.win64.exe"
checksum = "sha256:4c4da899972a431e9d340d3d2fe70bf760a5459bc1f859f5e7ef0f01700b84c9"

# clang-cl on Windows, the compiler the simulation's bit-identical results are checked with
# (docs/windows.md). macOS uses Xcode's clang.
[tools."github:llvm/llvm-project"]
version = "llvmorg-23.1.5"
os = ["windows"]
bin_path = "bin"
strip_components = 1

[tools."github:llvm/llvm-project".platforms.windows-x64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/clang%2Bllvm-23.1.5-x86_64-pc-windows-msvc.tar.zst"
checksum = "sha256:b2be33385ddc86e83511417a060de927ae8b09d1f3017cc3cdce5c73cd5029d7"

[env]
XMAKE_CONFIGDIR = "{{ config_root }}/../.out/simulation/xmake"

[tasks.configure]
hide = true
run = "xmake config --yes --mode=release --builddir=../.out/simulation/build"

[tasks.build]
description = "Build the standalone world simulation, its diagnostics tool and its tests"
depends = ["configure"]
run = "xmake build --yes terra simulation-tests"

[tasks.test]
description = "Run the simulation checks without the engine, one process per test group side by side"
depends = ["build"]
run = "node test/groups.mjs ../.out/simulation/build"

[tasks.terra]
description = "Run the diagnostics tool, for example: mise run terra -- map --seed 42 --age 4.6e9"
depends = ["build"]
run = "xmake run terra"
