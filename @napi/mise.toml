[tools."github:xmake-io/xmake"]
version = "v3.1.2"
bin_path = "."

[tools."github:xmake-io/xmake".platforms.macos-arm64]
asset_pattern = "xmake-bundle-v3.1.2.macos.arm64"
rename_exe = "xmake"
checksum = "sha256:e719121c56cd34f5f0c0731954a154c1df1b0915f303e5c82dfb6c6cb9e3ef9e"

[env]
XMAKE_CONFIGDIR = "{{ config_root }}/../.out/xmake"

[tasks.setup]
run = "npm ci"

[tasks.build]
run = [
  "xmake config --yes --mode=release --builddir=../.out/xmake/build",
  "xmake build --yes derivean",
]

[tasks.test]
run = [
  "xmake build --yes engine-tests",
  "xmake run engine-tests",
  "node --test test/*.test.cjs",
]
